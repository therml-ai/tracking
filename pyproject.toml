[project]
name = "tracking"
version = "0.1.0"
description = "Algorithms for tracking bubbles in two-phase simulations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    "scipy>=1.14",
    "torch>=2.10",
]

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "track"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "pytest",
]
viz = [
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
]
